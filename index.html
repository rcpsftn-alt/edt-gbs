<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon EDT – GBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#0d0f14;--panel:#151821;--panel2:#1c2030;--line:#262b3b;--text:#e8eaf2;--muted:#8a90a6;--accent:#7c5cff;--accent2:#00d4a6;--danger:#ff5c7a;--warn:#ffb547;
  --hour:56px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:15px;color:#0d0f14}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:#3a4157;background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit;font-size:13px;width:180px;outline:none}
input[type=search]:focus{border-color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(0,212,166,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(0,212,166,0)}100%{box-shadow:0 0 0 0 rgba(0,212,166,0)}}
.next-title{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:2px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.meta b{color:var(--text);font-weight:600}
.count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2);font-weight:700;margin-top:10px}
.progress{height:5px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.today-list{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.mini:hover{background:var(--panel2)}
.mini .t{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;min-width:86px}
.mini .bar{width:3px;align-self:stretch;border-radius:3px}
.mini.past{opacity:.4}
.empty{color:var(--muted);font-size:13px}

/* week nav */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px;gap:10px;flex-wrap:wrap}
.weekbar h2{margin:0;font-size:16px;font-weight:700}
.weekbar .sub{color:var(--muted);font-size:12px;font-weight:500;margin-left:8px}
.nav{display:flex;gap:6px}

/* grid */
.grid{display:grid;grid-template-columns:48px repeat(5,1fr);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;z-index:3}
.gh .d{display:block;font-size:18px;color:var(--text);font-weight:800;margin-top:2px}
.gh.today .d{color:#fff;background:var(--accent);border-radius:8px;display:inline-block;padding:0 8px}
.hours{position:relative;border-right:1px solid var(--line)}
.hours span{position:absolute;right:6px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line)}
.col:first-of-type{border-left:0}
.col .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.55}
.col.today{background:rgba(124,92,255,.04)}
.ev{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;overflow:hidden;font-size:12px;line-height:1.25;cursor:pointer;border-left:3px solid;transition:transform .12s, filter .12s}
.ev:hover{transform:translateY(-1px);filter:brightness(1.15);z-index:2}
.ev .et{font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev .em{opacity:.8;font-size:11px;margin-top:3px;font-family:'JetBrains Mono',monospace}
.ev.past{opacity:.6}
.ev.dim{opacity:.12}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:4}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.tag.exam{background:rgba(255,92,122,.18);color:var(--danger)}
.tag.must{background:rgba(255,181,71,.18);color:var(--warn)}
.tag.dist{background:rgba(0,212,166,.15);color:var(--accent2)}

/* list view */
.list{display:flex;flex-direction:column;gap:14px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.day h3{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:capitalize;font-weight:700}
.day.today h3{color:var(--accent)}
.row{display:flex;gap:12px;padding:10px;border-radius:10px;cursor:pointer;align-items:stretch}
.row:hover{background:var(--panel2)}
.row .time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-width:52px;line-height:1.5}
.row .bar{width:4px;border-radius:4px}
.row .ti{font-weight:700;font-size:14px}
.row .sm{color:var(--muted);font-size:12px;margin-top:3px}

/* exams strip */
.exams{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.exam{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.exam b{display:block;font-size:13px}
.exam .j{color:var(--danger);font-weight:700;font-family:'JetBrains Mono',monospace}

.prof{cursor:copy;border-bottom:1px dashed rgba(138,144,166,.6);user-select:text;-webkit-user-select:text}
.prof:hover{color:var(--accent2);border-color:var(--accent2)}
.prof .cp{font-size:.85em;opacity:.6}
.kv dd,.sheet h3{user-select:text;-webkit-user-select:text}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid;display:inline-block}
.legend b{color:var(--text);font-weight:700}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;padding:20px;position:relative}
.sheet h3{margin:6px 0 12px;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.kv a{color:var(--accent2)}
.x{position:absolute;top:12px;right:12px;background:var(--panel2);border:0;border-radius:8px;width:30px;height:30px}
.xsheet{max-width:760px;max-height:92vh;overflow:auto}
.xrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.xprev{background:#07080b;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center;max-height:56vh;overflow:auto}
.xprev canvas{max-width:100%;max-height:52vh;height:auto;border-radius:6px}
#xOut img{max-width:100%;border-radius:8px;margin-top:8px}
#xOut p{font-size:12px;color:var(--muted);margin:8px 0 0}
.foot{margin-top:24px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:60}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  input[type=search]{width:100%}
  .tools{width:100%}
}
</style>
</head>

        <button data-v="list">Liste</button>

  <div class="legend" id="legend"></div>

  <div class="foot">

</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

    <div class="seg" id="xType"><button data-t="png" class="on">PNG</button><button data-t="gif">GIF animé</button></div>
  </div>
  <div class="xprev"><canvas id="xCanvas"></canvas></div>
  <div class="xrow" style="justify-content:space-between">
    <span id="xInfo" style="color:var(--muted);font-size:12px"></span>
    <button class="btn primary" id="xGo">Télécharger</button>
  </div>
  <div id="xOut"></div>
</div></div>

function mk(d,hm){return new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),+hm.slice(0,2),+hm.slice(2,4))}
function fromBuiltin(){
  return S.trim().split("\n").map(l=>{
    const [d,a,b,k,loc,...n]=l.split(",");const c=C[k];
    return {start:mk(d,a),end:mk(d,b),title:c[0],mode:c[1],prof:c[2],loc,note:n.join(",")};
  });
}
function unesc(s){return (s||"").replace(/\\n/g,"\n").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\\\/g,"\\").trim()}
function parseICS(txt){
  txt=txt.replace(/\r?\n[ \t]/g,"");
  const out=[];
  for(const blk of txt.split("BEGIN:VEVENT").slice(1)){
    const g=k=>{const m=blk.match(new RegExp("^"+k+"[^:\\r\\n]*:(.*)$","m"));return m?m[1].trim():""};
    const ds=g("DTSTART"),de=g("DTEND");if(!ds)continue;
    const p=s=>{const m=s.match(/(\d{8})T?(\d{4})?/);return mk(m[1],m[2]||"0000")};
    const parts=unesc(g("SUMMARY")).split("|").map(s=>s.trim());
    let title=parts[0].replace(/\s*(1ère|2ème|3ème) année\s*$/,"");
    let prof=(parts[2]||"").split(",")[0].trim();
    const loc=[...new Set(unesc(g("LOCATION")).split(",").map(s=>s.trim()).filter(Boolean))].join(" / ");
    out.push({start:p(ds),end:de?p(de):p(ds),title,mode:parts[1]||"",prof,loc,note:unesc(g("DESCRIPTION"))});
  }
  return out;
}

function renderWeek(){

  const nd=we?7:5;const ds=[...Array(nd)].map((_,i)=>addD(wk,i));
  const H=document.documentElement.style;const hp=56;
  const total=(h1-h0)*hp;

  ds.forEach(d=>{html+=`<div class="gh ${sameDay(d,now)?"today":""}">${d.toLocaleDateString("fr-FR",{weekday:"short"})}<span class="d">${d.getDate()}</span></div>`});
  html+=`<div class="hours" style="height:${total}px">`;
  for(let h=h0+1;h<h1;h++)html+=`<span style="top:${(h-h0)*hp}px">${h}h</span>`;
  html+=`</div>`;
  ds.forEach(d=>{
    html+=`<div class="col ${sameDay(d,now)?"today":""}" style="height:${total}px">`;
    for(let h=h0+1;h<h1;h++)html+=`<div class="hl" style="top:${(h-h0)*hp}px"></div>`;
    const de=wEv.filter(e=>sameDay(e.start,d));

    const lanes=[];de.forEach(e=>{let l=0;while(lanes[l]&&lanes[l]>e.start)l++;lanes[l]=e.end;e._l=l});
    const nl=Math.max(1,lanes.length);
    de.forEach(e=>{
      const top=((e.start.getHours()+e.start.getMinutes()/60)-h0)*hp;
      const ht=Math.max(22,(e.end-e.start)/36e5*hp-2);
      const c=col(e);const w=100/nl;
      html+=`<div class="ev ${e.end<now?"past":""} ${match(e)?"":"dim"}" data-i="${EV.indexOf(e)}" style="top:${top}px;height:${ht}px;left:calc(${e._l*w}% + 4px);right:auto;width:calc(${w}% - 8px);background:${hexA(c,.26)};border-color:${c};color:#fff">
        <div class="et">${esc(e.title)}</div><div class="em">${hm(e.start)}–${hm(e.end)}${e.loc?" · "+esc(e.loc):""}</div></div>`;
    });

    html+=`</div>`;
  });
  html+=`</div>`;
  if(!wEv.length)html=`<div class="card empty" style="text-align:center;padding:40px">Aucun cours cette semaine 😴</div>`;
  return html;
}

  const words=text.split(/\s+/);const lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width<=maxW)cur=t;else{if(cur)lines.push(cur);cur=w;if(lines.length>=maxL)break}}

  ctx.font=`600 ${f(17)}px Inter, system-ui, sans-serif`;let lx=P;
  const used=new Set(wEv.map(campus));
  Object.entries(CAMPUS).filter(([k])=>used.has(k)||k!=="X").forEach(([k,c])=>{
    ctx.fillStyle=hexA(c.color,.3);rr(ctx,lx,y-f(14),f(18),f(18),f(5));ctx.fill();ctx.strokeStyle=c.color;ctx.lineWidth=f(2.5);ctx.stroke();
    ctx.fillStyle="#e8eaf2";const t=c.name+(c.rooms?"  ·  "+c.rooms:"");ctx.fillText(t,lx+f(28),y);lx+=f(28)+ctx.measureText(t).width+f(30);
  });
  y+=f(story?30:24);
  // grille
  const gx=P,gy=y,gw=W-2*P,gh=H-y-P-f(40);
  ctx.fillStyle="#151821";rr(ctx,gx,gy,gw,gh,f(20));ctx.fill();ctx.strokeStyle="#262b3b";ctx.lineWidth=f(1.5);ctx.stroke();
  const hc=f(52),hh=f(62);const cw=(gw-hc)/nd;const bodyH=gh-hh-f(10);const hp=bodyH/(h1-h0);
  days.forEach((d,i)=>{
    const cx=gx+hc+i*cw;const today=sameDay(d,new Date());
    if(i>0){ctx.strokeStyle="#262b3b";ctx.beginPath();ctx.moveTo(cx,gy+f(8));ctx.lineTo(cx,gy+gh-f(8));ctx.stroke()}
    ctx.textAlign="center";ctx.fillStyle=today?"#7c5cff":"#8a90a6";ctx.font=`600 ${f(15)}px Inter, system-ui, sans-serif`;
    ctx.fillText(d.toLocaleDateString("fr-FR",{weekday:"short"}).toUpperCase(),cx+cw/2,gy+f(26));
    ctx.fillStyle=today?"#fff":"#e8eaf2";ctx.font=`800 ${f(24)}px Inter, system-ui, sans-serif`;ctx.fillText(d.getDate(),cx+cw/2,gy+f(52));
  });
  ctx.strokeStyle="#262b3b";ctx.beginPath();ctx.moveTo(gx,gy+hh);ctx.lineTo(gx+gw,gy+hh);ctx.stroke();
  const by=gy+hh+f(4);
  ctx.textAlign="right";ctx.font=`500 ${f(13)}px "JetBrains Mono", ui-monospace, monospace`;
  for(let h=h0;h<=h1;h++){const yy=by+(h-h0)*hp;ctx.fillStyle="#8a90a6";if(h>h0&&h<h1)ctx.fillText(h+"h",gx+hc-f(8),yy+f(4));
    ctx.strokeStyle="rgba(38,43,59,.6)";ctx.beginPath();ctx.moveTo(gx+hc,yy);ctx.lineTo(gx+gw,yy);ctx.stroke()}
  ctx.textAlign="left";
  // événements
  const sorted=[...wEv].sort((a,b)=>a.start-b.start);const n=sorted.length;
  days.forEach((d,i)=>{
    const de=sorted.filter(e=>sameDay(e.start,d));const lanes=[];de.forEach(e=>{let l=0;while(lanes[l]&&lanes[l]>e.start)l++;lanes[l]=e.end;e._l=l});const nl=Math.max(1,lanes.length);
    de.forEach(e=>{
      const k=sorted.indexOf(e);const t0=n>1?k/n*0.75:0;const a=Math.max(0,Math.min(1,(p-t0)/0.18));if(a<=0)return;
      const ease=1-Math.pow(1-a,3);
      const lw=(cw-f(10))/nl;const x=gx+hc+i*cw+f(5)+e._l*lw;const top=by+((e.start.getHours()+e.start.getMinutes()/60)-h0)*hp+f(2)+(1-ease)*f(24);
      const h=Math.max(f(28),(e.end-e.start)/36e5*hp-f(4));const w=lw-f(4);const c=col(e);
      ctx.save();ctx.globalAlpha=ease;
      ctx.fillStyle="#151821";rr(ctx,x,top,w,h,f(12));ctx.fill();
      ctx.fillStyle=hexA(c,.28);rr(ctx,x,top,w,h,f(12));ctx.fill();
      ctx.save();rr(ctx,x,top,w,h,f(12));ctx.clip();ctx.fillStyle=c;ctx.fillRect(x,top,f(6),h);
      const tx=x+f(14),mw=w-f(22);
      ctx.fillStyle="#fff";ctx.font=`700 ${f(story?16:15)}px Inter, system-ui, sans-serif`;
      const lh=f(story?20:19);const maxL=Math.max(1,Math.floor((h-f(40))/lh));
      const lines=wrapLines(ctx,e.title,mw,maxL);lines.forEach((l,j)=>ctx.fillText(l,tx,top+f(24)+j*lh));
      ctx.fillStyle="rgba(255,255,255,.75)";ctx.font=`500 ${f(story?13:12)}px "JetBrains Mono", ui-monospace, monospace`;
      const meta=`${hm(e.start)}–${hm(e.end)}`;const my=top+f(24)+lines.length*lh+f(2);
      if(my<top+h-f(4))ctx.fillText(meta,tx,my);
      if(e.loc&&my+lh<top+h-f(4)){let l=e.loc;while(l&&ctx.measureText("📍 "+l).width>mw)l=l.slice(0,-1);ctx.fillText(l===e.loc?l:l+"…",tx,my+f(story?18:17))}
      ctx.restore();ctx.restore();
    });
  });
  if(!wEv.length){ctx.fillStyle="#8a90a6";ctx.font=`600 ${f(22)}px Inter, system-ui, sans-serif`;ctx.textAlign="center";ctx.fillText("Aucun cours cette semaine 😴",gx+gw/2,gy+gh/2);ctx.textAlign="left"}
  // pied
  const tot=wEv.reduce((s,e)=>s+(e.end-e.start),0)/36e5;
  ctx.fillStyle="#8a90a6";ctx.font=`500 ${f(15)}px Inter, system-ui, sans-serif`;
  ctx.fillText(`${wEv.length} cours · ${Math.round(tot*10)/10} h cette semaine`,P,H-P+f(4));
}
function xSize(scale=1){return xFmt==="story"?[1080*scale,1920*scale]:[1600*scale,1000*scale]}
function xPreview(){
  cancelAnimationFrame(xAnimRaf);
  const cv=document.getElementById("xCanvas");const [W,H]=xSize();cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  document.getElementById("xOut").innerHTML="";
  document.getElementById("xInfo").textContent=`${W}×${H} px · ${xType==="gif"?"animation des cours qui apparaissent":"image fixe"}`;
  if(xType==="png"){drawWeek(ctx,W,H,1);return}
  const t0=performance.now();const loop=t=>{const p=((t-t0)%4200)/2400;drawWeek(ctx,W,H,Math.min(1,p));xAnimRaf=requestAnimationFrame(loop)};xAnimRaf=requestAnimationFrame(loop);
}
let gifLib=null;
async function makeGif(){
  if(!gifLib)gifLib=await import("https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js");
  const {GIFEncoder,quantize,applyPalette}=gifLib;
  const [W,H]=xSize(xFmt==="story"?0.5:0.6);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d",{willReadFrequently:true});
  const enc=GIFEncoder();const N=28;
  // palette commune calculée sur l'image finale
  drawWeek(ctx,W,H,1);const pal=quantize(ctx.getImageData(0,0,W,H).data,256);
  for(let i=0;i<=N;i++){
    drawWeek(ctx,W,H,i/N);const d=ctx.getImageData(0,0,W,H).data;
    enc.writeFrame(applyPalette(d,pal),W,H,{palette:pal,delay:i===N?3500:(i===0?400:70)});
    document.getElementById("xGo").textContent=`Encodage… ${Math.round(i/N*100)}%`;
    await new Promise(r=>setTimeout(r,0));
  }
  enc.finish();return new Blob([enc.bytes()],{type:"image/gif"});
}
function xName(ext){return `edt-semaine-${wk.getFullYear()}-${pad(wk.getMonth()+1)}-${pad(wk.getDate())}${xFmt==="story"?"-story":""}.${ext}`}
async function xExport(){
  const btn=document.getElementById("xGo");btn.disabled=true;
  try{
    let blob;
    if(xType==="png"){const cv=document.createElement("canvas");const [W,H]=xSize();cv.width=W;cv.height=H;drawWeek(cv.getContext("2d"),W,H,1);blob=await new Promise(r=>cv.toBlob(r,"image/png"))}
    else blob=await makeGif();
    const name=xName(xType);
    let saved=false;
    try{
      const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
      if(dl){await dl.save({filename:name,data:blob});saved=true;toast("✓ "+name+" enregistré")}
    }catch(err){if(err&&err.code==="declined"){toast("Téléchargement annulé");saved=true}}
    if(!saved&&!window.claude){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();saved=true;toast("✓ "+name+" téléchargé")}
    if(!saved){
      const url=URL.createObjectURL(blob);
      document.getElementById("xOut").innerHTML=`<p>Le téléchargement direct n'est pas dispo ici : fais un clic droit (ou appui long) sur l'image → « Enregistrer l'image ».</p><img src="${url}" alt="${name}">`;
    }
  }catch(e){toast("Erreur pendant l'export");console.error(e)}
  btn.disabled=false;btn.textContent="Télécharger";
}
document.getElementById("exportBtn").onclick=async()=>{
  try{await Promise.all([document.fonts.load('800 20px Inter'),document.fonts.load('700 20px Inter'),document.fonts.load('600 20px Inter'),document.fonts.load('500 20px "JetBrains Mono"')])}catch(e){}
  document.getElementById("xModal").classList.add("on");xPreview();
};
document.getElementById("xModal").addEventListener("click",e=>{if(e.target.id==="xModal"){e.currentTarget.classList.remove("on");cancelAnimationFrame(xAnimRaf)}});
document.querySelectorAll("#xFmt button").forEach(b=>b.onclick=()=>{xFmt=b.dataset.f;document.querySelectorAll("#xFmt button").forEach(x=>x.classList.toggle("on",x===b));xPreview()});
document.querySelectorAll("#xType button").forEach(b=>b.onclick=()=>{xType=b.dataset.t;document.querySelectorAll("#xType button").forEach(x=>x.classList.toggle("on",x===b));xPreview()});
document.getElementById("xGo").onclick=xExport;

render();
setInterval(renderHero,30000);
(async()=>{
  try{
    const [r,u]=await Promise.all([fetch("edt.ics?v="+Date.now(),{cache:"no-store"}),fetch("updated.txt?v="+Date.now(),{cache:"no-store"}).catch(()=>null)]);
    if(!r.ok)return;const txt=await r.text();const ev=parseICS(txt);if(!ev.length)return;
    EV=ev.sort((a,b)=>a.start-b.start);
    const iso=u&&u.ok?(await u.text()).trim():"";
    const d=iso?new Date(iso):null;
    source=d&&!isNaN(d)?d.toLocaleDateString("fr-FR")+" à "+hm(d)+" (auto, chaque jeudi 12h)":"auto";
    render();
  }catch(e){}
})();
