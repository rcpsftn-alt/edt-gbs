name: Rappels Discord

on:
  schedule:
    # 3 créneaux (heures UTC) pour rester sous la limite de 6h par job
    - cron: "30 3 * * *"   # 04:00 → 09:30 UTC (programme du jour 7h, partiels, 1ers cours)
    - cron: "0 9 * * *"    # 09:30 → 15:00 UTC
    - cron: "30 14 * * *"  # 15:00 → 20:30 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Quoi envoyer maintenant"
        type: choice
        options: ["test", "demo", "programme", "partiels", "alerte changement (démo)", "patch note v1"]
        default: "test"
      demo_campus:
        description: "Campus (mode demo)"
        type: choice
        options: ["les deux", "Campus des quais", "Campus Lucien Faure"]
        default: "les deux"
      ping:
        description: "Ping le rôle"
        type: boolean
        default: false
      message:
        description: "Texte du message (optionnel)"
        type: string
        default: ""

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choisir le créneau
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "30 3 * * *")  echo "start=04:00" >> $GITHUB_OUTPUT; echo "end=09:30" >> $GITHUB_OUTPUT ;;
            "0 9 * * *")   echo "start=09:30" >> $GITHUB_OUTPUT; echo "end=15:00" >> $GITHUB_OUTPUT ;;
            "30 14 * * *") echo "start=15:00" >> $GITHUB_OUTPUT; echo "end=20:30" >> $GITHUB_OUTPUT ;;
            *)             echo "start=00:00" >> $GITHUB_OUTPUT; echo "end=00:00" >> $GITHUB_OUTPUT ;;
          esac
      - name: Envoyer
        env:
          ICAL: ${{ secrets.ICAL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ vars.DISCORD_ROLE_ID || '1450177530836287682' }}
          SLOT_START: ${{ steps.slot.outputs.start }}
          SLOT_END: ${{ steps.slot.outputs.end }}
          MODE: ${{ inputs.mode }}
          DEMO_CAMPUS: ${{ inputs.demo_campus }}
          PING: ${{ inputs.ping }}
          TEST_MESSAGE: ${{ inputs.message }}
        run: |
          if [ "$MODE" = "patch note v1" ]; then
            ANNONCE=annonces/patch-v1.json node scripts/announce.mjs
          elif [ "$MODE" = "alerte changement (démo)" ]; then
            DEMO=true node scripts/changes.mjs
          else
            node scripts/remind.mjs
          fi
