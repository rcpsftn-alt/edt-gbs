name: Mise à jour EDT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-edt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'heure (6h / 12h / 18h à Paris)
        id: gate
        run: |
          H=$(TZ=Europe/Paris date +%-H)
          LAST=$(date -d "$(cat updated.txt 2>/dev/null || echo 1970-01-01)" +%s 2>/dev/null || echo 0)
          AGE=$(( $(date +%s) - LAST ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif { [ "$H" = "6" ] || [ "$H" = "7" ] || [ "$H" = "12" ] || [ "$H" = "13" ] || [ "$H" = "18" ] || [ "$H" = "19" ]; } && [ "$AGE" -gt 10800 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Il est ${H}h à Paris (dernière MAJ il y a ${AGE}s), rien à faire."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Télécharger l'iCal
        if: steps.gate.outputs.run == 'true'
        env:
          EDT_ICAL_URL: ${{ secrets.ICAL || secrets.EDT_ICAL_URL }}
        run: |
          cp edt.ics old.ics 2>/dev/null || true
          curl -fsSL --retry 3 "$EDT_ICAL_URL" -o edt.new.ics
          grep -q "BEGIN:VCALENDAR" edt.new.ics
          mv edt.new.ics edt.ics
          date -u +%Y-%m-%dT%H:%M:%SZ > updated.txt

      - name: Alerte Discord si l'EDT a changé
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ vars.DISCORD_ROLE_ID || '1450177530836287682' }}
        run: node scripts/changes.mjs old.ics edt.ics

      - name: Publier
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -f old.ics
          git config user.name "edt-bot"
          git config user.email "edt-bot@users.noreply.github.com"
          git add edt.ics updated.txt
          git commit -m "EDT mis à jour $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')" || echo "Aucun changement"
          git push
